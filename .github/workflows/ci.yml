name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo registry & index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (debug)
        run: cargo build --workspace --all-targets --verbose

      - name: Run tests
        run: cargo test --workspace --all --verbose

      # ℱ(G) = ℱ(G): incremental ADR indexing must equal a full re-sync.
      # (docs/DESIGN-claims-and-freshness.md, Step 8)
      - name: Index integrity oracle
        run: cargo test --test index_integrity -- --nocapture
